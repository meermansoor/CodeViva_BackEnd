<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Tester Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.65);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated Background */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: -1;
      animation: float 20s infinite alternate;
    }
    .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: rgba(139, 92, 246, 0.15); }
    .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: rgba(59, 130, 246, 0.15); animation-delay: -5s; }
    
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--card-border);
      background: rgba(9, 9, 11, 0.5);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { 
      font-weight: 700; 
      font-size: 1.5rem; 
      background: linear-gradient(to right, #a78bfa, #60a5fa); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      width: 100%;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      flex-grow: 1;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .panel h2 { font-size: 1.1rem; font-weight: 600; color: #fff; }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.875rem; color: var(--text-muted); font-weight: 500; }
    
    input, select, textarea {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2); 
    }
    textarea { min-height: 200px; resize: vertical; font-family: monospace; }

    .row { display: flex; gap: 1rem; }
    .row > * { flex: 1; }
    .flex-3 { flex: 3 !important; }

    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); }

    .response-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #3f3f46;
    }
    .status-success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .status-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .response-area {
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1.25rem;
      flex-grow: 1;
      overflow-y: auto;
      max-height: 600px;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .preset-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 999px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn:hover { 
      background: rgba(139, 92, 246, 0.2); 
      color: #fff;
      border-color: rgba(139, 92, 246, 0.5);
    }

    /* JSON Syntax Highlighting */
    .json-key { color: #93c5fd; }
    .json-string { color: #86efac; }
    .json-number { color: #fca5a5; }
    .json-boolean { color: #fdba74; }
    .json-null { color: #d8b4fe; }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header>
    <h1>API Tester Pro</h1>
    <div style="color: var(--text-muted); font-size: 0.9rem;">MultiAgentic System Testing Environment</div>
  </header>

  <div class="container">
    <!-- REQUEST PANEL -->
    <div class="panel">
      <h2>Configure Request</h2>
      
      <div class="form-group">
        <label>Quick Presets</label>
        <div class="presets" id="presets">
          <button class="preset-btn" onclick="loadPreset('getBanks')">GET Question Banks</button>
          <button class="preset-btn" onclick="loadPreset('genQuestions')">POST Generate Questions</button>
          <button class="preset-btn" onclick="loadPreset('createRoom')">POST Create Room</button>
          <button class="preset-btn" onclick="loadPreset('evaluatorHealth')">GET RAG Health (8000)</button>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Method</label>
          <select id="method">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
            <option value="PUT">PUT</option>
            <option value="DELETE">DELETE</option>
          </select>
        </div>
        <div class="form-group flex-3">
          <label>Endpoint URL</label>
          <input type="text" id="url" value="http://localhost:5000/api/questions" placeholder="http://localhost:5000/api/...">
        </div>
      </div>

      <div class="form-group">
        <label>Headers (JSON Format)</label>
        <input type="text" id="headers" value='{"Content-Type": "application/json"}' placeholder='{"Authorization": "Bearer token"}'>
      </div>

      <div class="form-group">
        <label>Body Content (JSON)</label>
        <textarea id="body" placeholder='{"key": "value"}'></textarea>
      </div>

      <button id="sendBtn" onclick="sendRequest()">
        <span>Send Request</span>
        <div class="loading" id="loader"></div>
      </button>
    </div>

    <!-- RESPONSE PANEL -->
    <div class="panel">
      <div class="response-header">
        <h2>Response</h2>
        <div class="row" style="align-items: center; gap: 1rem;">
          <span id="timeBadge" style="font-size: 0.8rem; color: var(--text-muted);"></span>
          <span id="statusBadge" class="status-badge" style="display: none;"></span>
        </div>
      </div>
      
      <div class="response-area" id="responseArea">Hit "Send Request" to see the response here...</div>
    </div>
  </div>

  <script>
    const presets = {
      getBanks: {
        method: 'GET',
        url: 'http://localhost:5000/api/questions',
        body: ''
      },
      genQuestions: {
        method: 'POST',
        url: 'http://localhost:5000/api/questions/generate',
        body: '{\n  "title": "Test Syllabus",\n  "subject": "CS",\n  "courseCode": "CS101",\n  "numQuestions": 5\n}'
      },
      createRoom: {
        method: 'POST',
        url: 'http://localhost:5000/api/teacher/exam-rooms',
        body: '{\n  "questionBankId": "YOUR_BANK_ID_HERE",\n  "allowedStudents": [\n    {"rollNo": "1", "name": "Test", "email": "test@test.com"}\n  ]\n}'
      },
      evaluatorHealth: {
        method: 'GET',
        url: 'http://192.168.10.95:8000/docs',
        body: ''
      }
    };

    function loadPreset(key) {
      const p = presets[key];
      document.getElementById('method').value = p.method;
      document.getElementById('url').value = p.url;
      document.getElementById('body').value = p.body;
    }

    function syntaxHighlight(json) {
      if (typeof json != 'string') {
        json = JSON.stringify(json, undefined, 2);
      }
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          if (/:$/.test(match)) {
            cls = 'json-key';
          } else {
            cls = 'json-string';
          }
        } else if (/true|false/.test(match)) {
          cls = 'json-boolean';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return '<span class="' + cls + '">' + match + '</span>';
      });
    }

    async function sendRequest() {
      const btn = document.getElementById('sendBtn');
      const loader = document.getElementById('loader');
      const responseArea = document.getElementById('responseArea');
      const statusBadge = document.getElementById('statusBadge');
      const timeBadge = document.getElementById('timeBadge');

      const method = document.getElementById('method').value;
      const url = document.getElementById('url').value;
      let headersStr = document.getElementById('headers').value;
      const bodyStr = document.getElementById('body').value;

      if (!url) {
        alert("Please enter an endpoint URL.");
        return;
      }

      let headers = {};
      try {
        if (headersStr.trim()) {
          headers = JSON.parse(headersStr);
        }
      } catch (e) {
        alert("Invalid Headers JSON");
        return;
      }

      const options = {
        method,
        headers
      };

      if (method !== 'GET' && method !== 'HEAD' && bodyStr.trim()) {
        try {
          JSON.parse(bodyStr); // Validate JSON
          options.body = bodyStr;
        } catch (e) {
          alert("Invalid Body JSON");
          return;
        }
      }

      // UI Loading state
      btn.disabled = true;
      loader.style.display = 'inline-block';
      btn.querySelector('span').style.opacity = '0.5';
      responseArea.innerHTML = 'Sending request...';
      statusBadge.style.display = 'none';
      timeBadge.innerText = '';

      const startTime = performance.now();

      try {
        const res = await fetch(url, options);
        const endTime = performance.now();
        const timeTaken = Math.round(endTime - startTime);

        // Status Badge
        statusBadge.style.display = 'inline-block';
        statusBadge.innerText = `${res.status} ${res.statusText}`;
        statusBadge.className = res.ok ? 'status-badge status-success' : 'status-badge status-error';
        timeBadge.innerText = `${timeTaken}ms`;

        // Parse Response
        const contentType = res.headers.get("content-type");
        if (contentType && contentType.indexOf("application/json") !== -1) {
          const data = await res.json();
          responseArea.innerHTML = syntaxHighlight(data);
        } else {
          const text = await res.text();
          responseArea.innerText = text;
        }
      } catch (err) {
        const endTime = performance.now();
        statusBadge.style.display = 'inline-block';
        statusBadge.innerText = 'ERROR';
        statusBadge.className = 'status-badge status-error';
        timeBadge.innerText = `${Math.round(endTime - startTime)}ms`;
        responseArea.innerText = `Fetch Error: \n${err.message}\n\nMake sure the server is running and CORS is enabled.`;
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
        btn.querySelector('span').style.opacity = '1';
      }
    }
  </script>
</body>
</html>
